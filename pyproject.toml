[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="multimodal-rag-visual-intelligence"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.110,<1","uvicorn[standard]>=0.27,<1","python-multipart>=0.0.9","pymupdf>=1.23"]
[project.optional-dependencies]
dev=["pytest>=8","httpx>=0.27"]
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
testpaths=["tests"]
